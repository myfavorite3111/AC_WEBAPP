{% extends 'base.html' %}
{% block title %}Log Scrap Return{% endblock %}
{% block content %}<div class="min-h-screen bg-slate-50 px-4 py-8"><div class="max-w-3xl mx-auto"><div class="bg-white rounded-3xl border p-6"><h1 class="text-3xl font-black">Log Return</h1><p class="text-slate-600 mt-1">{{ record.item_name }} | Pending {{ record.quantity_pending }}</p>{% if error %}<div class="mt-4 bg-red-50 border border-red-200 rounded-2xl p-4 font-bold text-red-700">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="mt-5 grid grid-cols-1 gap-4">{% csrf_token %}<label class="font-bold">Quantity Received<input name="quantity_logged" type="number" step="0.01" required class="mt-2 w-full border rounded-2xl px-4 py-3"></label><label class="font-bold">Condition<select name="condition" class="mt-2 w-full border rounded-2xl px-4 py-3">{% for value,label in condition_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label><label class="font-bold">Photo<input name="photo" type="file" accept="image/*" capture="environment" class="mt-2 w-full border rounded-2xl px-4 py-3"></label><label class="font-bold">Remarks<textarea name="remarks" rows="3" class="mt-2 w-full border rounded-2xl px-4 py-3"></textarea></label><button class="bg-green-600 text-white rounded-2xl px-5 py-4 font-black">Save Return</button></form></div></div></div>{% endblock %}
