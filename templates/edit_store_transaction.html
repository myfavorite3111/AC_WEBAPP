{% extends 'base.html' %}

{% block title %}
Edit Store Transaction
{% endblock %}

{% block content %}

<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">

<div class="min-h-screen bg-slate-50 px-4 py-8">
    <div class="max-w-5xl mx-auto">
        <div class="bg-gradient-to-r from-[#0F4C81] to-[#1B6CA8] rounded-3xl p-8 shadow-xl mb-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                    <h1 class="text-4xl font-black text-white">
                        Edit Store Transaction
                    </h1>
                    <p class="text-blue-100 mt-2">
                        Update transaction details and stock movement.
                    </p>
                </div>

                <a href="{% url 'store_transaction_detail' transaction.id %}"
                   class="bg-white text-[#0F4C81] px-5 py-3 rounded-2xl font-bold">
                    Back
                </a>
            </div>
        </div>

        {% if error %}
        <div class="mb-6 bg-red-50 border border-red-200 text-red-700 px-5 py-4 rounded-2xl font-bold">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="bg-white rounded-3xl border shadow-sm p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block font-bold mb-2">Store Item *</label>
                        <select id="item-select" name="item" required class="w-full border rounded-2xl px-4 py-3">
                            <option value="">Search & Select Item</option>
                            {% for item in items %}
                            <option value="{{ item.id }}" {% if transaction.item_id == item.id %}selected{% endif %}>
                                {{ item.item_code }} | {{ item.item_description }}
                                {% if item.size %}| {{ item.size }}{% endif %}
                                {% if item.item_type_label %}| {{ item.item_type_label }}{% endif %}
                                | Stock: {{ item.current_stock }} {{ item.get_unit_display }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block font-bold mb-2">Transaction Type *</label>
                        <select name="transaction_type" required class="w-full border rounded-2xl px-4 py-3">
                            <option value="">Select Type</option>
                            {% for key,value in transaction_type_choices %}
                            <option value="{{ key }}" {% if transaction.transaction_type == key %}selected{% endif %}>
                                {{ value }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block font-bold mb-2">Purpose *</label>
                        <select name="purpose" required class="w-full border rounded-2xl px-4 py-3">
                            <option value="">Select Purpose</option>
                            {% for key,value in purpose_choices %}
                            <option value="{{ key }}" {% if transaction.purpose == key %}selected{% endif %}>
                                {{ value }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block font-bold mb-2">Project</label>
                        <select id="project-select" name="project" class="w-full border rounded-2xl px-4 py-3">
                            <option value="">No Project</option>
                            {% for project in projects %}
                            <option value="{{ project.id }}" {% if transaction.project_id == project.id %}selected{% endif %}>
                                {{ project.project_id }} - {{ project.site_name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block font-bold mb-2">Quantity *</label>
                        <input type="number"
                               step="0.01"
                               min="0"
                               name="quantity"
                               value="{{ transaction.quantity }}"
                               required
                               class="w-full border rounded-2xl px-4 py-3">
                    </div>

                    <div>
                        <label class="block font-bold mb-2">Issued To</label>
                        <input type="text"
                               name="issued_to"
                               value="{{ transaction.issued_to|default:'' }}"
                               class="w-full border rounded-2xl px-4 py-3">
                    </div>

                    <div>
                        <label class="block font-bold mb-2">AMC Customer Name</label>
                        <input type="text"
                               name="amc_customer_name"
                               value="{{ transaction.amc_customer_name|default:'' }}"
                               class="w-full border rounded-2xl px-4 py-3">
                    </div>

                    <div>
                        <label class="block font-bold mb-2">Warranty Customer Name</label>
                        <input type="text"
                               name="warranty_customer_name"
                               value="{{ transaction.warranty_customer_name|default:'' }}"
                               class="w-full border rounded-2xl px-4 py-3">
                    </div>

                    <div>
                        <label class="block font-bold mb-2">Service Customer Name</label>
                        <input type="text"
                               name="service_customer_name"
                               value="{{ transaction.service_customer_name|default:'' }}"
                               class="w-full border rounded-2xl px-4 py-3">
                    </div>

                    <div>
                        <label class="block font-bold mb-2">Replace Invoice / File</label>
                        <input type="file"
                               name="invoice_file"
                               class="w-full border rounded-2xl px-4 py-3 bg-white">
                    </div>
                </div>

                <div class="mt-6">
                    <label class="block font-bold mb-2">Description</label>
                    <textarea name="description"
                              rows="4"
                              class="w-full border rounded-2xl px-4 py-3">{{ transaction.description|default:'' }}</textarea>
                </div>
            </div>

            <div class="mt-6 flex gap-3">
                <button type="submit"
                        class="bg-[#0F4C81] text-white px-8 py-4 rounded-2xl font-black">
                    Update Transaction
                </button>

                <a href="{% url 'store_transaction_detail' transaction.id %}"
                   class="bg-slate-200 text-slate-700 px-8 py-4 rounded-2xl font-black">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        new TomSelect("#item-select", {
            create: false,
            maxOptions: 1000,
            sortField: {field: "text", direction: "asc"},
            placeholder: "Search Item Name, Code, Size, Stock..."
        });

        new TomSelect("#project-select", {
            create: false,
            maxOptions: 1000,
            sortField: {field: "text", direction: "asc"},
            placeholder: "Search Project..."
        });
    });
</script>

{% endblock %}
