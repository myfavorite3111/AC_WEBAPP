{% extends 'base.html' %}
{% block title %}Update Unit Status{% endblock %}
{% block content %}
<div class="min-h-screen bg-slate-50 px-4 py-8"><div class="max-w-4xl mx-auto"><div class="bg-gradient-to-r from-[#0F4C81] to-[#1B6CA8] rounded-3xl p-7 shadow-xl mb-6"><h1 class="text-3xl font-black text-white">Update Unit Status</h1><p class="text-blue-100 mt-2">{{ unit.serial_number }} | {{ unit.get_current_status_display }}</p></div>{% if error %}<div class="mb-5 rounded-2xl bg-red-50 border border-red-200 p-4 text-red-700 font-bold">{{ error }}</div>{% endif %}<form method="post" enctype="multipart/form-data" class="bg-white rounded-3xl border p-6 grid grid-cols-1 md:grid-cols-2 gap-5">{% csrf_token %}<label class="font-bold">Next Status<select name="status" required class="mt-2 w-full border rounded-2xl px-4 py-3"><option value="">Select</option>{% for value,label in status_choices %}{% if value in valid_next_statuses %}<option value="{{ value }}">{{ label }}</option>{% endif %}{% endfor %}</select></label><label class="font-bold">Zone<select name="zone" class="mt-2 w-full border rounded-2xl px-4 py-3"><option value="">No Zone / Site</option>{% for zone in zones %}<option value="{{ zone.id }}">{{ zone.name }}</option>{% endfor %}</select></label><label class="font-bold">Responsible Handler<select name="handler" class="mt-2 w-full border rounded-2xl px-4 py-3"><option value="">Current user</option>{% for tech in technicians %}<option value="{{ tech.id }}">{{ tech.username }}</option>{% endfor %}</select></label><label class="font-bold">Customer / Installation Site<select name="customer" class="mt-2 w-full border rounded-2xl px-4 py-3"><option value="">Keep blank</option>{% for customer in customers %}<option value="{{ customer.id }}">{{ customer.customer_name }}</option>{% endfor %}</select></label><label class="font-bold">Photo<input name="photo" type="file" accept="image/*" capture="environment" class="mt-2 w-full border rounded-2xl px-4 py-3"><span class="text-xs text-red-600">Required for Damaged/Missing.</span></label><label class="font-bold md:col-span-2">Condition / Handoff Note<textarea name="condition_note" rows="4" class="mt-2 w-full border rounded-2xl px-4 py-3" placeholder="Box condition, handoff remark, return reason..."></textarea></label><button class="md:col-span-2 bg-green-600 text-white rounded-2xl px-6 py-4 font-black">Log Status Event</button></form></div></div>{% endblock %}
