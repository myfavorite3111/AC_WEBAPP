{% extends 'base.html' %}
{% block title %}Scan Unit QR{% endblock %}
{% block content %}<div class="min-h-screen bg-slate-50 px-4 py-8"><div class="max-w-3xl mx-auto"><div class="bg-white rounded-3xl border p-6"><h1 class="text-3xl font-black mb-2">Scan Unit QR</h1><p class="text-slate-600 mb-5">Use phone camera to open a serial unit record without typing.</p><div id="reader" class="rounded-2xl overflow-hidden border"></div><p id="scan-result" class="mt-4 font-bold text-blue-700"></p></div></div></div><script src="https://unpkg.com/html5-qrcode"></script><script>function onScanSuccess(decodedText){document.getElementById('scan-result').innerText='Opening: '+decodedText; window.location.href=decodedText;} new Html5QrcodeScanner('reader',{fps:10,qrbox:260}).render(onScanSuccess);</script>{% endblock %}
