{% extends 'base.html' %}
{% block title %}New Scrap Return{% endblock %}
{% block content %}<div class="min-h-screen bg-slate-50 px-4 py-8"><div class="max-w-5xl mx-auto"><div class="bg-gradient-to-r from-[#0F4C81] to-slate-900 rounded-3xl p-7 shadow-xl mb-6"><h1 class="text-3xl font-black text-white">New Scrap Return Expectation</h1><p class="text-blue-100 mt-2">Use when an old/faulty part is expected back from a site.</p></div>{% if error %}<div class="mb-5 bg-red-50 border border-red-200 rounded-2xl p-4 font-bold text-red-700">{{ error }}</div>{% endif %}<form method="post" class="bg-white rounded-3xl border p-6 grid grid-cols-1 md:grid-cols-2 gap-5">{% csrf_token %}<label class="font-bold">Customer<select name="customer" class="mt-2 w-full border rounded-2xl px-4 py-3"><option value="">Select customer</option>{% for customer in customers %}<option value="{{ customer.id }}">{{ customer.customer_name }}</option>{% endfor %}</select></label><label class="font-bold">Project<select name="project" class="mt-2 w-full border rounded-2xl px-4 py-3"><option value="">Optional</option>{% for project in projects %}<option value="{{ project.id }}">{{ project.site_name }}</option>{% endfor %}</select></label><label class="font-bold">Material Issue<select name="material_issue" class="mt-2 w-full border rounded-2xl px-4 py-3"><option value="">Optional</option>{% for issue in issues %}<option value="{{ issue.id }}">{{ issue.issue_id }} - {{ issue.heading }}</option>{% endfor %}</select></label><label class="font-bold">Technician<select name="technician" class="mt-2 w-full border rounded-2xl px-4 py-3"><option value="">Select technician</option>{% for tech in technicians %}<option value="{{ tech.id }}">{{ tech.username }}</option>{% endfor %}</select></label><label class="font-bold">Item Name *<input name="item_name" required class="mt-2 w-full border rounded-2xl px-4 py-3" placeholder="Old compressor / copper scrap / fan motor"></label><label class="font-bold">Job Reference<input name="complaint_or_job_reference" class="mt-2 w-full border rounded-2xl px-4 py-3" placeholder="Complaint, site visit, job card"></label><label class="font-bold">Expected Quantity *<input name="quantity_expected" required type="number" step="0.01" class="mt-2 w-full border rounded-2xl px-4 py-3"></label><label class="font-bold">Approx Value Per Unit<input name="approx_value" type="number" step="0.01" class="mt-2 w-full border rounded-2xl px-4 py-3"></label><label class="font-bold">Due Return Date<input name="due_return_date" type="date" value="{{ default_due|date:'Y-m-d' }}" class="mt-2 w-full border rounded-2xl px-4 py-3"></label><label class="font-bold">Condition<select name="condition" class="mt-2 w-full border rounded-2xl px-4 py-3">{% for value,label in condition_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label><label class="font-bold md:col-span-2">Remarks<textarea name="remarks" rows="3" class="mt-2 w-full border rounded-2xl px-4 py-3"></textarea></label><button class="md:col-span-2 bg-green-600 text-white rounded-2xl px-6 py-4 font-black">Create Scrap Return Record</button></form></div></div>{% endblock %}
